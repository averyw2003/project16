{% extends 'base.html' %}

{% block title %}Toegang · Lijstje{% endblock %}

{% block content %}
<section class="auth-panel panel" aria-labelledby="visitor-login-title">
  <p class="eyebrow">Privé-lijstje</p>
  <h1 id="visitor-login-title">Welkom</h1>
  <p class="muted">
    Voer het wachtwoord in om het lijstje van Sara te bekijken.
  </p>

  {% if error %}
    <p class="alert" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('visitor_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">Wachtwoord</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      autocomplete="current-password"
      autofocus
    >

    <button type="submit" class="button button-primary full-width">
      Open lijstje <span aria-hidden="true">→</span>
    </button>
  </form>
</section>
{% endblock %}
