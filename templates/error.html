{% extends 'base.html' %}

{% block title %}{{ title }} · Cadeaulijst{% endblock %}

{% block content %}
<section class="auth-panel panel" aria-labelledby="error-title">

  <h1 id="error-title">{{ title }}</h1>

    Terug naar de cadeaulijst <span aria-hidden="true">→</span>
  </a>
</section>
{% endblock %}
