<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toegang - Cadeaulijstje Sara 2025</title>
  <style>
    :root{--bg:#f7f7fb;--card:#ffffff;--text:#111827;--muted:#6b7280;--brand:#7c3aed;--brand-dark:#6d28d9;--ring:rgba(124,58,237,.35);}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
    
    /* Vaag gemaakte achtergrond */
    .background-blur{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 100%);filter:blur(8px);opacity:0.3;z-index:-1}
    .background-content{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;opacity:0.1}
    
    .card{width:100%;max-width:400px;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(17,24,39,.06),0 2px 6px rgba(17,24,39,.04);overflow:hidden;position:relative;z-index:1}
    .header{padding:24px 28px;border-bottom:1px solid #eef2ff;background:radial-gradient(1200px 200px at -5% -20%,rgba(124,58,237,.06),transparent 60%)}
    h1{margin:0;font-size:26px;letter-spacing:.2px;text-align:center}
    p.sub{margin:6px 0 0;color:var(--muted);text-align:center}
    
    .login-form{padding:28px}
    .form-group{margin-bottom:20px}
    label{display:block;margin-bottom:8px;font-weight:600;color:var(--text)}
    input[type="password"]{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:16px;transition:.15s border-color,.15s box-shadow}
    input[type="password"]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
    .error{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px;margin-bottom:20px;font-size:14px}
    button.primary{width:100%;padding:12px 16px;border-radius:10px;border:0;background:var(--brand);color:white;font-weight:600;cursor:pointer;box-shadow:0 6px 14px rgba(124,58,237,.25);font-size:16px;transition:.15s background}
    button.primary:hover{background:var(--brand-dark)}
    button.primary:active{transform:translateY(1px)}
  </style>
</head>
<body>
  <!-- Vaag gemaakte achtergrond -->
  <div class="background-blur"></div>
  <div class="background-content">
    <div class="card" style="margin:24px;opacity:0.2;">
      <div class="header">
        <h1>Cadeaulijstje Sara 2025</h1>
        <p class="sub">Cadeau ideeën. Vink een box aan. <span class="pill">(0/0) aangevinkt</span></p>
      </div>
      <div style="padding:20px;">
        <div style="display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px dashed #eef2ff;">
          <div style="flex:0 0 32px;height:32px;border-radius:10px;background:#f5f3ff;color:#5b21b6;display:inline-flex;align-items:center;justify-content:center;font-weight:600;">1</div>
          <div style="flex:1 1 auto;">
            <div style="text-decoration: none;">Voorbeeld cadeau 1</div>
            <div style="color:#6b7280;font-size:14px;">https://example.com</div>
          </div>
          <div style="flex:0 0 auto;margin-top:3px;">
            <input type="checkbox" style="width:20px;height:20px;border-radius:6px;border:2px solid #e5e7eb;" />
          </div>
        </div>
        <div style="display:flex;gap:14px;align-items:flex-start;padding:14px 20px;">
          <div style="flex:0 0 32px;height:32px;border-radius:10px;background:#f5f3ff;color:#5b21b6;display:inline-flex;align-items:center;justify-content:center;font-weight:600;">2</div>
          <div style="flex:1 1 auto;">
            <div style="text-decoration: line-through;opacity:0.6;">Voorbeeld cadeau 2</div>
            <div style="color:#6b7280;font-size:14px;">https://example.com</div>
          </div>
          <div style="flex:0 0 auto;margin-top:3px;">
            <input type="checkbox" checked style="width:20px;height:20px;border-radius:6px;border:2px solid #e5e7eb;" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Login formulier -->
  <div class="card">
    <div class="header">
      <h1>🔒 Toegang</h1>
      <p class="sub">Voer het wachtwoord in om de cadeaulijst te bekijken</p>
    </div>
    <form method="post" class="login-form">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <div class="form-group">
        <label for="password">Wachtwoord:</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      <button type="submit" class="primary">Inloggen</button>
    </form>
  </div>
</body>
</html>
