{% extends 'base.html' %}
{% block title %}Inloggen · Cadeaulijst{% endblock %}
{% block content %}
<section class="auth-panel panel"><p class="eyebrow">Alleen voor beheerders</p><h1>Welkom terug</h1><p class="muted">Log in om de cadeaulijst te beheren.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">Wachtwoord</label><input id="password" name="password" type="password" required autocomplete="current-password" autofocus>
    <button type="submit" class="button button-primary full-width">Inloggen <span aria-hidden="true">→</span></button>
  </form>
</section>
{% endblock %}
